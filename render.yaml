services:
  - type: web
    name: research-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_STORAGE_BUCKET
        value: delve-documents
      - key: WS_TICKET_SECRET
        generateValue: true
      - key: MAX_CONCURRENT_JOBS_PER_USER
        value: "2"
      - key: MAX_RESEARCH_JOBS_PER_DAY
        value: "15"
      - key: MAX_LLM_CALLS_PER_JOB
        value: "30"
      - key: MAX_LLM_CALLS_IN_FLIGHT
        value: "4"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: MAX_UPLOAD_PAGES
        value: "100"
      - key: MAX_EXTRACTED_TEXT_BYTES
        value: "5242880"
      - key: MAX_DOCUMENTS_PER_USER
        value: "20"
